<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Thread | MySite</title>
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <nav class="navbar"><div class="container">
    <a class="navbar__brand" href="../../index.html">🌐 MySite</a>
    <ul class="navbar__links">
      <li><a href="../../index.html">Home</a></li>
      <li><a href="../forum/forum_list.html" class="active">Forum</a></li>
      <li><a href="../cart/products.html">Shop</a></li>
      <li><a href="../blog/blog_list.html">Blog</a></li>
      <li><a href="../review/review_list.html">Reviews</a></li>
      <li><a href="../shared/sitemap.html">Sitemap</a></li>
    </ul>
    <div class="navbar__auth">
      <a href="../shared/login.html" class="btn btn-outline btn-sm">Log In</a>
      <a href="../shared/register.html" class="btn btn-primary btn-sm">Register</a>
    </div>
  </div></nav>
  <main class="page-body">
    <div class="page-header"><div class="container">
      <p style="font-size:.85rem;color:var(--color-muted);margin-bottom:.4rem;"><a href="forum_list.html">← Back to Forum</a></p>
      <h1>Start a New Thread</h1>
    </div></div>
    <div class="container" style="max-width:680px;">
      <div class="card">
        <form action="#" method="POST" enctype="multipart/form-data">
          <div class="form-group">
            <label for="title">Thread Title <span style="color:var(--color-danger)">*</span></label>
            <input type="text" id="title" name="title" placeholder="What is your discussion about?" required maxlength="200" />
          </div>
          <div class="form-group">
            <label for="content">Post Content <span style="color:var(--color-danger)">*</span></label>
            <textarea id="content" name="content" placeholder="Share your thoughts in detail…" rows="6" required></textarea>
          </div>
          <div class="form-group">
            <label for="image">Attach Image (optional)</label>
            <input type="file" id="image" name="image" accept="image/*" />
          </div>
          <div style="display:flex;gap:.75rem;flex-wrap:wrap;">
            <button type="submit" class="btn btn-primary">Post Thread</button>
            <a href="forum_list.html" class="btn btn-outline">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </main>
  <footer><p>&copy; 2026 MySite — COSC3060 Web Programming Studio</p></footer>
</body>
</html>
