<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Thread | Lang & Co.</title>
  <link rel="stylesheet" href="../../public/css/landingpage/index.css" />
  <link rel="stylesheet" href="../../public/css/header.css" />
  <link rel="stylesheet" href="../../public/css/shared-include.css" />
  <link rel="stylesheet" href="../../public/css/forum/forum.css" />
</head>

<body>

  <!-- Header and navigation -->
  <iframe src="../global/header_shoppingcart.html#nav-forum" title="Header"
    class="shared-include shared-header shared-header--light" loading="eager" scrolling="no"></iframe>

  <div class="wave">

    <div class="forum-breadcrumb">
      <a href="../../index.html">Home</a> <span aria-hidden="true">&bull;</span>
      <a href="forum.html">Forum</a> <span aria-hidden="true">&bull;</span>
      <span aria-current="page">Create Thread</span>
    </div>

      <div class="wishlist-header container">
            <h1>Forum</h1>
            <p class="wishlist-header__sub">Join the Conversations</p>
      </div>
      
    <div class="forum-title">
      <h1>Create Thread</h1>
    </div>

    <form class="create-thread-form" id="createThreadForm" action="#" method="POST">

      <input type="text" name="title" class="create-thread-title-input" placeholder="Title" required>

      <div class="create-thread-topic-row">
        <button type="button" class="topic-add-btn" id="addTopicBtn">+ Topic</button>
        <div class="create-thread-topics" id="topicList"></div>
      </div>

      <textarea name="content" class="create-thread-content" placeholder="Content" required></textarea>

      <div class="create-thread-actions">
        <a href="forum.html" class="draft-btn" id="cancelBtn">Cancel</a>
        <button type="button" class="draft-btn" id="saveDraftBtn">Save Draft</button>
        <button type="submit" class="post-btn">Post</button>
      </div>

    </form>

  </div>

  <iframe src="../global/footer.html" title="Footer" class="shared-include shared-footer" loading="lazy"
    scrolling="no"></iframe>

</body>

</html>
