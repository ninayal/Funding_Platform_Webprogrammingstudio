<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Write a Review | MySite</title><link rel="stylesheet" href="../../css/style.css"/></head>
<body>
  <nav class="navbar"><div class="container">
    <a class="navbar__brand" href="../../index.html">🌐 MySite</a>
    <ul class="navbar__links"><li><a href="../../index.html">Home</a></li><li><a href="../forum/forum_list.html">Forum</a></li><li><a href="../cart/products.html">Shop</a></li><li><a href="../blog/blog_list.html">Blog</a></li><li><a href="review_list.html" class="active">Reviews</a></li><li><a href="../shared/sitemap.html">Sitemap</a></li></ul>
    <div class="navbar__auth"><a href="../shared/login.html" class="btn btn-outline btn-sm">Log In</a><a href="../shared/register.html" class="btn btn-primary btn-sm">Register</a></div>
  </div></nav>
  <main class="page-body">
    <div class="page-header"><div class="container"><p style="font-size:.85rem;color:var(--color-muted);margin-bottom:.4rem;"><a href="review_list.html">← Back to Reviews</a></p><h1>Write a Review</h1></div></div>
    <div class="container" style="max-width:640px;">
      <div class="card">
        <form action="#" method="POST" enctype="multipart/form-data">
          <div class="form-group"><label for="title">Review Title *</label><input type="text" id="title" name="title" placeholder="Summarise your experience in one line" required /></div>
          <div class="form-group"><label for="product">Product Name *</label><input type="text" id="product" name="product" placeholder="e.g. Wireless Noise-Cancelling Headphones" required /></div>
          <div class="form-group"><label for="rating">Star Rating *</label><select id="rating" name="rating" required><option value="">Select rating</option><option value="5">★★★★★ Excellent</option><option value="4">★★★★☆ Good</option><option value="3">★★★☆☆ Average</option><option value="2">★★☆☆☆ Poor</option><option value="1">★☆☆☆☆ Terrible</option></select></div>
          <div class="form-group"><label for="description">Full Review *</label><textarea id="description" name="description" rows="6" placeholder="Describe your experience in detail. What did you like or dislike?" required></textarea></div>
          <div class="form-group"><label for="image">Upload Photo (optional)</label><input type="file" id="image" name="image" accept="image/*" /></div>
          <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-top:.5rem;"><button type="submit" class="btn btn-primary">Submit Review</button><a href="review_list.html" class="btn btn-outline">Cancel</a></div>
        </form>
      </div>
    </div>
  </main>
  <footer><p>&copy; 2026 MySite — COSC3060 Web Programming Studio</p></footer>
</body></html>
