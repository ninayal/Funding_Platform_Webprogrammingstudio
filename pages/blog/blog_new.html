<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>New Post | MySite</title><link rel="stylesheet" href="../../css/style.css"/></head>
<body>
  <nav class="navbar"><div class="container">
    <a class="navbar__brand" href="../../index.html">🌐 MySite</a>
    <ul class="navbar__links"><li><a href="../../index.html">Home</a></li><li><a href="../forum/forum_list.html">Forum</a></li><li><a href="../cart/products.html">Shop</a></li><li><a href="blog_list.html" class="active">Blog</a></li><li><a href="../review/review_list.html">Reviews</a></li><li><a href="../shared/sitemap.html">Sitemap</a></li></ul>
    <div class="navbar__auth"><a href="../shared/login.html" class="btn btn-outline btn-sm">Log In</a><a href="../shared/register.html" class="btn btn-primary btn-sm">Register</a></div>
  </div></nav>
  <main class="page-body">
    <div class="page-header"><div class="container"><p style="font-size:.85rem;color:var(--color-muted);margin-bottom:.4rem;"><a href="blog_list.html">← Back to Blog</a></p><h1>Write a New Post</h1></div></div>
    <div class="container" style="max-width:700px;">
      <div class="card">
        <form action="#" method="POST" enctype="multipart/form-data">
          <div class="form-group"><label for="title">Title *</label><input type="text" id="title" name="title" placeholder="Give your post a clear, descriptive title" required /></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 1rem;">
            <div class="form-group"><label for="category">Category *</label><select id="category" name="category" required><option value="">Select category</option><option>Technology</option><option>Education</option><option>Lifestyle</option><option>Other</option></select></div>
            <div class="form-group"><label for="tags">Tags</label><input type="text" id="tags" name="tags" placeholder="e.g. webdev, css, tips" /></div>
          </div>
          <div class="form-group"><label for="content">Content *</label><textarea id="content" name="content" rows="10" placeholder="Write your post content here…" required></textarea></div>
          <div class="form-group"><label for="image">Featured Image</label><input type="file" id="image" name="image" accept="image/*" /></div>
          <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-top:.5rem;"><button type="submit" class="btn btn-primary">Publish Post</button><a href="blog_list.html" class="btn btn-outline">Cancel</a></div>
        </form>
      </div>
    </div>
  </main>
  <footer><p>&copy; 2026 MySite — COSC3060 Web Programming Studio</p></footer>
</body></html>
