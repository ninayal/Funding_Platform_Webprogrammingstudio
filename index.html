<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home | Lang & Co.</title>
  <link rel="stylesheet" href="public/css/index.css" />
  <link rel="stylesheet" href="public/css/header.css" />
  <link rel="stylesheet" href="public/css/shared-include.css" />
</head>

<body>

  <!-- banner showup the new collection when pop landing page up -->

  <section class="hero">

    <div class="hero__bg"></div>

    <iframe
      src="pages/shared/header.html#nav-home"
      title="Header"
      class="shared-include shared-header"
      loading="eager"
      scrolling="no"
    ></iframe>

    <div class="hero__title">
      <span class="script">Làng &amp; Co.</span>
      <span class="serif">Vietnamese Traditional Crafts</span>
    </div>

    <!-- CTA Buttons below hero title -->
    <div class="hero__cta">
      <a class="hero__cta-primary" href="pages/shared/register.html">
        Explore the Collection →
      </a>
      <a class="hero__cta-ghost" href="pages/shared/login.html">
        Already have an account? Sign In →
      </a>
    </div>

  </section>

  <div class="wave">
    <div class="below">
      <p class="below__headline">
        <span class="sparkle">✦</span>
        Where Craft Meets<br>Living Tradition
        <span class="sparkle">✦</span>
      </p>

      <p class="below__sub">
        A curated marketplace where ancient Vietnamese artistry —
        ceramics, silk, lacquer, and wood — finds a home
        in the modern world.
      </p>

      <a class="below__btn" href="pages/shop.html">Explore the Collection</a>

    </div>
  </div>

  <iframe
    src="pages/shared/footer.html"
    title="Footer"
    class="shared-include shared-footer"
    loading="lazy"
    scrolling="no"
  ></iframe>

</body>

</html>
